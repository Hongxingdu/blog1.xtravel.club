# Site
name: 'Xtravel Blog'
description: 'Enjoy your trips '
logo: 'assets/images/logo.png'
favicon: 'assets/images/favicon.ico'
baseurl: '/'
disqus: 'vizthought'
email: 'info@xtravel.club'
mailchimp-list: 

include: ["_pages"]
permalink: /:title/

# Plugins
plugins: 
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-seo-tag
  
authors:
    August:
      name:           August
      site:           https://blog1.xtravel.club
      avatar:         /assets/images/avatar1.jpg
      bio:            "Hi, I am August, the author of Xtravel Blog, the articles you're currently reading. I hope you like it!"
      email:          info@xtravel.club
      twitter:        https://x.com/augustdu2

   
 
# Defaults
defaults:

  # all posts
  - scope:
      path: "_posts"
    values:
      layout: post
      author: august
      avatar: /assets/images/avatar1.jpg
      
  # all pages
  - scope:
      path: "_pages"
    values:
      layout: page
      
# Syntax
markdown: kramdown
highlighter: rouge

# Paginate
paginate: 10



# Exclude metadata and development time dependencies (like Grunt plugins)
exclude: [README.markdown, package.json, grunt.js, Gruntfile.js, Gruntfile.coffee, node_modules]